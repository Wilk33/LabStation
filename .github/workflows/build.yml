name: Build applications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-instruments:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test shared instrument communication
        run: dotnet run --project .\Shared\LabStation.Instruments.Tests\LabStation.Instruments.Tests.csproj -c Release

  korad:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Korad KA3005P
        run: dotnet test .\KA3005P\tests\Ka3005P.Tests\Ka3005P.Tests.csproj -c Release --nologo -p:SelfContained=false -p:PublishSingleFile=false -p:RuntimeIdentifier=

  oscilloscope:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and build Siglent SDS1000CML Viewer
        working-directory: SDS1000CML Viewer
        run: .\build.ps1

  generator:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and build Siglent SDG1000X Control
        working-directory: SDG1000X Control
        run: .\build.ps1

  multimeter:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and build Siglent SDM3000 Control
        working-directory: SDM3000 Viewer
        run: .\build.ps1
